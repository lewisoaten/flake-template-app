{# Returned to HTMX requests that fail. Deliberately does NOT extend base.html:
   it is swapped into an existing page, not served as a document. #}
<div
  role="alert"
  data-testid="error-banner"
  class="rounded-md border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800"
  x-data="flash"
  x-show="visible"
>
  <div class="flex items-start justify-between gap-4">
    <p>{{ message }}</p>
    <button type="button" class="text-rose-500 hover:text-rose-700" x-on:click="dismiss">
      Dismiss
    </button>
  </div>
</div>
