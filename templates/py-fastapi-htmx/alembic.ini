[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Timestamped, slugged filenames sort chronologically and read as a changelog.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Deliberately absent: sqlalchemy.url. The URL comes from APP_DATABASE_URL via
# migrations/env.py, so migrations and the app can never disagree about which
# database they are pointed at.

[post_write_hooks]
# Autogenerated migrations are formatted like the rest of the codebase.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
